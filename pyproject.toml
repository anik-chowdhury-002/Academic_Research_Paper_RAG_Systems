[project]
name = "research-paper"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Anik Chowdhury", email = "chowdhuryanik027@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "ddgs>=9.16.1",
    "duckduckgo-search>=8.1.1",
    "faiss-cpu>=1.15.1",
    "google-generativeai>=0.8.6",
    "huggingface-hub>=1.33.0",
    "ipykernel>=7.4.0",
    "langchain>=1.4.7",
    "langchain-classic>=1.0.8",
    "langchain-community>=0.4.2",
    "langchain-core>=1.7.1",
    "langchain-google-genai>=4.4.2",
    "langchain-groq>=1.1.3",
    "langchain-huggingface>=1.2.3",
    "langchain-text-splitters>=1.1.3",
    "langgraph>=1.2.18",
    "numpy>=2.4.6",
    "pydantic>=2.14.1",
    "pypdf>=6.21.4",
    "python-dotenv>=1.2.4",
    "scikit-learn>=1.9.1",
    "sentence-transformers>=6.2.0",
    "transformers>=5.21.1",
    "typing-extensions>=4.16.0",
    "wikipedia>=1.4.0",
]

[project.scripts]
research-paper = "research_paper:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"
